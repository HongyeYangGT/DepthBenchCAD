[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthbenchcad"
version = "1.0.0"
description = "DepthBenchCAD: three-level cost-aware counterfactual audit benchmark for generative CAD systems"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.5,<2.6",
]

[project.scripts]
depthbenchcad = "depthbenchcad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
